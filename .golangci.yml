version: "2"

linters:
  default: standard
  enable:
    - gosec
    - misspell
    - unparam
    - usetesting
    - wastedassign
  settings:
    usetesting:
      os-temp-dir: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      # The repository tools run the commands and open the files named on their command line; that is their job.
      - path: internal/(balsuite|covercheck)/
        linters:
          - gosec
        text: G204|G304

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/wso2/integration-workflow-runtime

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
