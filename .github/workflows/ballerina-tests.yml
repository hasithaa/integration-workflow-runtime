name: Ballerina tests

# Runs Ballerina programs on jBallerina (ballerina/workflow) against the engine binary built from this commit.
# Smoke on every pull request; the full suite on main, nightly and on demand.

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        required: true
        default: full
        type: choice
        options: [smoke, full]

permissions:
  contents: read

concurrency:
  group: ballerina-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TEMPORAL_CLI_VERSION: '1.9.1'

jobs:
  suite:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: >-
          ${{ fromJSON(
            github.event_name == 'pull_request' && '["smoke"]' ||
            github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.suite) ||
            '["smoke", "full"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: |
            engine/go.sum
            tools/go.sum
      - name: Build the engine
        run: make engine && ./build/workflow-engine version
      - name: Set up Ballerina (latest)
        uses: ballerina-platform/setup-ballerina@585120e3f0e540bf127376ee6e75d39e8ce6aaa4 # v1.1.5
        with:
          version: latest
      - name: Install the Temporal CLI (test harness only)
        run: |
          base="https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}"
          archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "$archive" temporal
          sudo mv temporal /usr/local/bin/temporal
          temporal --version
      - name: Run the ${{ matrix.suite }} suite
        env:
          ENGINE_LOG_DIR: build/logs
        run: go run ./tools/cmd/balsuite ${{ matrix.suite }} --engine build/workflow-engine
      - name: Upload engine and test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.suite }}-logs
          path: |
            build/logs/
            tests/ballerina/${{ matrix.suite }}/target/report/
          if-no-files-found: ignore
