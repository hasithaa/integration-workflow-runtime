name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - name: Get the version from the tag
        id: version
        run: |
          version="${GITHUB_REF#refs/tags/v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Any -suffix (e.g. -alpha.1, -rc.1) is a prerelease.
          if [[ "$version" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distribution
    needs: version
    uses: ./.github/workflows/build-dist.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  release:
    name: Create release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # keyless signing with Sigstore
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Each zip and the checksum file get a Sigstore bundle; verify with
      # cosign verify-blob --bundle <file>.sigstore.json --certificate-identity-regexp '^https://github.com/wso2/' \
      #   --certificate-oidc-issuer https://token.actions.githubusercontent.com <file>
      - name: Sign the archives and checksums
        run: |
          cd dist
          for file in *.zip SHA256SUMS; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/*.sigstore.json
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.is_prerelease }}
