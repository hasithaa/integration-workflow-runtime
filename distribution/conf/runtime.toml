# The runtime's configuration. [engine] and [database] are read by workflow-engine (docs/features/runtime-config.md),
# [api] and [database] by workflow-api (docs/features/api-server.md); the other tables are illustrative until their
# components arrive.
[runtime]
profiles = ["all"]          # or e.g. ["history"], ["api"]

[engine]
# Listen on every interface and tell other nodes and clients which address reaches this one.
# bindAddress = "0.0.0.0"
# broadcastAddress = "10.0.0.5"
# historyShards = 512        # fixed after the first start
logLevel = "info"

[database]
type = "postgresql"         # postgresql | mysql | sqlite
host = "db.example.com"
port = 5432
user = "workflow"
password = "$env{WORKFLOW_DB_PASSWORD}"
name = "temporal"
visibilityName = "temporal_visibility"
# apiDatabaseName = "workflow_api"   # the API server's database; SQLite: <apiDatabaseName>.db next to path

# [database.tls]
# enabled = true
# caFile = "conf/certs/db-ca.pem"

[api]
bindAddress = "127.0.0.1"   # plain HTTP for now; keep it on loopback or a private network until TLS arrives
port = 9090
# The engine's frontend; defaults to this node's [engine] broadcastAddress (or bindAddress) and frontend port.
# engineAddress = "10.0.0.5:7233"

[users]
store = "local"             # "local" (try-out and demos) or "sso" (production); never both

[users.local]
bootstrapAdmin = "admin"

[users.sso]
issuer = "https://idp.example.com/oauth2/token"
clientId = "workflow-runtime"
groupsClaim = "groups"
superAdminGroup = "workflow-admins"

[adminPortal]
enabled = true
path = "/admin"

[userPortal]
enabled = true
path = "/portal"
